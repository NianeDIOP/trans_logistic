  <rect x="27.5" y="5" width="9" height="3.6" rx="1.2" fill="#f6d58e" stroke="#0b2624" stroke-width="1.2"/>
  <rect x="25" y="30" width="14" height="11" rx="2" fill="#0b2624" opacity=".85"/>
