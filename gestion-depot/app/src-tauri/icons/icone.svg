  <line x1="9" y1="45.5" x2="55" y2="45.5" stroke="#7fb7ae" stroke-width="1.6"/>
  <line x1="24.3" y1="36" x2="24.3" y2="55" stroke="#7fb7ae" stroke-width="1.6"/>
