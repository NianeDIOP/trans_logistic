[package]
name = "gestion-depot-app"
description = "Gestion Dépôt et Boutique — application de bureau"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "gestion_depot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
donnees = { version = "1.0.0", path = "../../crates/donnees" }
noyau = { version = "1.0.0", path = "../../crates/noyau" }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = "2"
