appId: sn.deuxm.facturation
productName: 2M Facturation
copyright: Copyright © 2026 2M Logistique et Transport — Conçu par Niane Diop (77 158 89 03)
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - resources/**/*

win:
  icon: build/icon.ico
  executableName: 2M-Facturation
  target:
    - target: nsis
      arch: [x64]

# Installateur Windows : assistant classique en français, aux couleurs de l'application.
nsis:
  artifactName: 2M-Facturation-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  # Textes français des pages d'accueil et de fin, signature du concepteur.
  include: build/installer.nsh
  installerLanguages: [fr_FR]
  language: '1036'
  displayLanguageSelector: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 2M Facturation
  uninstallDisplayName: 2M Facturation
  runAfterFinish: true
  # Les factures (base SQLite) restent sur le poste après désinstallation.
  deleteAppDataOnUninstall: false
