name: Gestion Dépôt — tests et installateur Windows

# Projet indépendant de 2M Facturation : ne se déclenche que pour le dossier gestion-depot/.
on:
  push:
    branches: [main]
    paths: ['gestion-depot/**', '.github/workflows/gestion-depot.yml']
    tags: ['gestion-depot-*']
  pull_request:
    paths: ['gestion-depot/**', '.github/workflows/gestion-depot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gestion-depot

jobs:
  tests:
    name: Tests, analyse et compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gestion-depot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestion-depot/app/package-lock.json
      - name: Interface (vérification et compilation)
        working-directory: gestion-depot/app
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  installateur:
    name: Installateur Windows (.exe)
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gestion-depot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestion-depot/app/package-lock.json
      - name: Construire l'installateur
        working-directory: gestion-depot/app
        run: |
          npm ci
          npm run tauri build
      - name: Publier l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Depot-Setup
          path: gestion-depot/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Joindre l'installateur à la version (tag gestion-depot-*)
        if: startsWith(github.ref, 'refs/tags/gestion-depot-')
        uses: softprops/action-gh-release@v2
        with:
          files: gestion-depot/target/release/bundle/nsis/*.exe
          name: Gestion Dépôt et Boutique ${{ github.ref_name }}
          body: |
            Installateur Windows de **Gestion Dépôt et Boutique** (application hors connexion).

            1. Téléchargez le fichier `.exe` ci-dessous.
            2. Double-cliquez dessus. Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur
               « Informations complémentaires » puis « Exécuter quand même » (l'installateur n'est pas signé).
            3. L'application s'installe pour l'utilisateur courant et crée un raccourci.

            Conception : Niane Diop · 77 158 89 03
